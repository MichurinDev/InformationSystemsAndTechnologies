<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация инвестора</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="form-section" class="form-wrapper">
        <h1>Регистрация инвестора</h1>
        
        <form id="registrationForm">
            <div class="form-group">
                <label for="lastName">Фамилия *</label>
                <input type="text" id="lastName" name="lastName">
                <span class="error" id="lastNameError"></span>
            </div>

            <div class="form-group">
                <label for="firstName">Имя *</label>
                <input type="text" id="firstName" name="firstName">
                <span class="error" id="firstNameError"></span>
            </div>

            <div class="form-group">
                <label for="patronymic">Отчество</label>
                <input type="text" id="patronymic" name="patronymic">
                <span class="error" id="patronymicError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="phone">Телефон *</label>
                <input type="tel" id="phone" name="phone">
                <span class="error" id="phoneError"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">Город *</label>
                    <input type="text" id="city" name="city">
                    <span class="error" id="cityError"></span>
                </div>
                <div class="form-group">
                    <label for="street">Улица *</label>
                    <input type="text" id="street" name="street">
                    <span class="error" id="streetError"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="house">Дом *</label>
                    <input type="text" id="house" name="house">
                    <span class="error" id="houseError"></span>
                </div>
                <div class="form-group">
                    <label for="apartment">Квартира</label>
                    <input type="text" id="apartment" name="apartment">
                    <span class="error" id="apartmentError"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="investmentAmount">Сумма инвестиции (руб.) *</label>
                <input type="number" id="investmentAmount" name="investmentAmount" min="1000">
                <span class="error" id="investmentAmountError"></span>
            </div>

            <div class="form-group">
                <label for="experience">Опыт инвестирования *</label>
                <select id="experience" name="experience">
                    <option value="">-- Выберите --</option>
                    <option value="beginner">Новичок (0-1 года)</option>
                    <option value="intermediate">Опытный (1-5 лет)</option>
                    <option value="advanced">Продвинутый (5+ лет)</option>
                </select>
                <span class="error" id="experienceError"></span>
            </div>

            <div class="form-group">
                <label>Интересующие активы *</label>
                <div class="checkbox-group">
                    <div>
                        <input type="checkbox" id="stocks" name="assets" value="stocks">
                        <label for="stocks">Акции</label>
                    </div>
                    <div>
                        <input type="checkbox" id="bonds" name="assets" value="bonds">
                        <label for="bonds">Облигации</label>
                    </div>
                    <div>
                        <input type="checkbox" id="crypto" name="assets" value="crypto">
                        <label for="crypto">Криптовалюты</label>
                    </div>
                    <div>
                        <input type="checkbox" id="realestate" name="assets" value="realestate">
                        <label for="realestate">Недвижимость</label>
                    </div>
                </div>
                <span class="error" id="assetsError"></span>
            </div>

            <div class="form-group">
                <input type="checkbox" id="agree" name="agree">
                <label for="agree">Я согласен с условиями пользования *</label>
                <span class="error" id="agreeError"></span>
            </div>

            <button type="submit" class="submit-btn">Зарегистрироваться</button>
        </form>
    </div>

    <div id="welcome-section" class="welcome-wrapper hidden">
        <h1>Добро пожаловать, <span id="welcomeName"></span>!</h1>
        
        <div class="welcome-table">
            <div class="table-row">
                <span class="table-label">ФИО:</span>
                <span id="displayFullName" class="table-value"></span>
            </div>
            <div class="table-row">
                <span class="table-label">Email:</span>
                <span id="displayEmail" class="table-value"></span>
            </div>
            <div class="table-row">
                <span class="table-label">Телефон:</span>
                <span id="displayPhone" class="table-value"></span>
            </div>
            <div class="table-row">
                <span class="table-label">Адрес:</span>
                <span id="displayAddress" class="table-value"></span>
            </div>
            <div class="table-row">
                <span class="table-label">Сумма инвестиции:</span>
                <span id="displayAmount" class="table-value"></span>
            </div>
            <div class="table-row">
                <span class="table-label">Опыт:</span>
                <span id="displayExperience" class="table-value"></span>
            </div>
            <div class="table-row">
                <span class="table-label">Активы:</span>
                <span id="displayAssets" class="table-value"></span>
            </div>
        </div>

        <p class="message">Ваша регистрация завершена. Мы свяжемся с вами в ближайшее время.</p>
        <button class="submit-btn" onclick="resetForm()">Зарегистрироваться снова</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
